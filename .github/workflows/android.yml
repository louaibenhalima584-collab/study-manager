name: Build APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Download and Setup Gradle Wrapper
        run: |
          gradle version || true
          npx -y gradle-wrapper-generator || true
          # بديل تثبيت الwrapper يدوياً إذا لم يكن موجوداً
          curl -s https://raw.githubusercontent.com/gradle/gradle-build-action/main/.github/workflows/gradle-wrapper.sh | bash || true
          # أو الحل الأبسط: إنشاء ملف gradlew فارغ وتجاوزه
          printf '#!/usr/bin/env sh\ngradle "$@"\n' > gradlew
          chmod +x gradlew

      - name: Build APK
        run: ./gradlew assembleDebug

      - name: Upload APK File
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
